<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ---------- Sprites ----------
// Pixel data comes from the original 1978 arcade ROM (Computer Archeology's
// Space Invaders disassembly: https://www.computerarcheology.com/Arcade/SpaceInvaders/Code.html).
// The ROM stores each sprite as columns: one byte per column, bit 7 is the top pixel.
const ROM = {
  squid:   { start: 4, width: 8,  frames: [
    '00 00 00 00 19 3A 6D FA FA 6D 3A 19 00 00 00 00',
    '00 00 00 00 1A 3D 68 FC FC 68 3D 1A 00 00 00 00'] },
  crab:    { start: 3, width: 11, frames: [
    '00 00 00 78 1D BE 6C 3C 3C 3C 6C BE 1D 78 00 00',
    '00 00 00 0E 18 BE 6D 3D 3C 3D 6D BE 18 0E 00 00'] },
  octopus: { start: 2, width: 12, frames: [
    '00 00 39 79 7A 6E EC FA FA EC 6E 7A 79 39 00 00',
    '00 00 38 7A 7F 6D EC FA FA EC 6D 7F 7A 38 00 00'] },
  cannon:  { start: 2, width: 13, frames: [
    '00 00 0F 1F 1F 1F 1F 7F FF 7F 1F 1F 1F 1F 0F 00'] }
};

// Turn column bytes into 8 rows of 'X' / '.' strings.
function decodeSprite(hex, start, width) {
  const bytes = hex.split(' ').map(h => parseInt(h, 16)).slice(start, start + width);
  const rows = [];
  for (let r = 0; r < 8; r++) {
    rows.push(bytes.map(b => (b & (0x80 >> r)) ? 'X' : '.').join(''));
  }
  return rows;
}

const SPRITES = {};
for (const [name, d] of Object.entries(ROM)) {
  SPRITES[name] = d.frames.map(f => decodeSprite(f, d.start, d.width));
}
const SCALE = 3;

// Pre-render each sprite frame to its own canvas in its own colour.
function renderSprite(rows, color, scale = SCALE) {
  const c = document.createElement('canvas');
  c.width = rows[0].length * scale;
  c.height = rows.length * scale;
  const g = c.getContext('2d');
  g.fillStyle = color;
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      if (row[x] === 'X') g.fillRect(x * scale, y * scale, scale, scale);
    }
  });
  return c;
}

// One entry per invader row: sprite type, colour, points.
const ROW_TYPES = [
  { type: 'squid',   color: '#ff4de1', points: 30 },
  { type: 'crab',    color: '#00e5ff', points: 20 },
  { type: 'crab',    color: '#00e5ff', points: 20 },
  { type: 'octopus', color: '#5dff4d', points: 10 },
  { type: 'octopus', color: '#5dff4d', points: 10 }
];
const rowFrames = ROW_TYPES.map(r => SPRITES[r.type].map(f => renderSprite(f, r.color)));
const CANNON_COLOR = '#33ff33';
const cannonImg = renderSprite(SPRITES.cannon[0], CANNON_COLOR);
const cannonIcon = renderSprite(SPRITES.cannon[0], CANNON_COLOR, 2);
ctx.imageSmoothingEnabled = false;

// ---------- Constants ----------
const COLS = 11;
const ROWS = ROW_TYPES.length;
const CELL_W = 48;
const CELL_H = 36;
const STEP_X = 8;
const DROP_Y = 16;
const EDGE_MARGIN = 10;
const START_Y = 60;
const STEP_INTERVAL = 0.5; // seconds per step at full strength

// Bunker: arched shield with a notch underneath. 24 x 16 cells, 3 px per cell.
const BUNKER_SHAPE = [
  '......XXXXXXXXXXXX......',
  '....XXXXXXXXXXXXXXXX....',
  '..XXXXXXXXXXXXXXXXXXXX..',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXXXXXXXXXX',
  'XXXXXXXXXX....XXXXXXXXXX',
  'XXXXXXXXX......XXXXXXXXX',
  'XXXXXXXXX......XXXXXXXXX',
  'XXXXXXXXX......XXXXXXXXX'
];
const BUNKER_CELL = 3;
const BUNKER_COLS = BUNKER_SHAPE[0].length;
const BUNKER_ROWS = BUNKER_SHAPE.length;
const BUNKER_Y = 450;
const BUNKER_COUNT = 4;
const BUNKER_COLOR = '#33ff33';

// Ground line sits directly under the cannon; lives are shown below it.
const GROUND_Y = 572;
const GROUND_H = 3;

// 5x7 pixel font (only the glyphs the HUD needs).
const FONT = {
  '0': ['.XXX.', 'X...X', 'X..XX', 'X.X.X', 'XX..X', 'X...X', '.XXX.'],
  '1': ['..X..', '.XX..', '..X..', '..X..', '..X..', '..X..', '.XXX.'],
  '2': ['.XXX.', 'X...X', '....X', '...X.', '..X..', '.X...', 'XXXXX'],
  '3': ['XXXX.', '....X', '....X', '.XXX.', '....X', '....X', 'XXXX.'],
  '4': ['...X.', '..XX.', '.X.X.', 'X..X.', 'XXXXX', '...X.', '...X.'],
  '5': ['XXXXX', 'X....', 'XXXX.', '....X', '....X', 'X...X', '.XXX.'],
  '6': ['..XX.', '.X...', 'X....', 'XXXX.', 'X...X', 'X...X', '.XXX.'],
  '7': ['XXXXX', '....X', '...X.', '..X..', '.X...', '.X...', '.X...'],
  '8': ['.XXX.', 'X...X', 'X...X', '.XXX.', 'X...X', 'X...X', '.XXX.'],
  '9': ['.XXX.', 'X...X', 'X...X', '.XXXX', '....X', '...X.', '.XX..'],
  'S': ['.XXXX', 'X....', 'X....', '.XXX.', '....X', '....X', 'XXXX.'],
  'C': ['.XXX.', 'X...X', 'X....', 'X....', 'X....', 'X...X', '.XXX.'],
  'O': ['.XXX.', 'X...X', 'X...X', 'X...X', 'X...X', 'X...X', '.XXX.'],
  'R': ['XXXX.', 'X...X', 'X...X', 'XXXX.', 'X.X..', 'X..X.', 'X...X'],
  'E': ['XXXXX', 'X....', 'X....', 'XXXX.', 'X....', 'X....', 'XXXXX']
};

function drawPixelText(text, x, y, scale, color) {
  ctx.fillStyle = color;
  for (const ch of text) {
    const g = FONT[ch];
    if (g) {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (g[r][c] === 'X') ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
        }
      }
    }
    x += 6 * scale; // 5 columns plus 1 column of spacing
  }
}

// ---------- State ----------
const ship = { width: cannonImg.width, height: cannonImg.height, x: W / 2 - cannonImg.width / 2, y: H - 54, speed: 300 };
const keys = { left: false, right: false, fire: false };

let invaders, swarm, playerBullet, invaderBullets, bunkers;
let lives, score, wave, state; // state: 'play' | 'over'
let invulnerable, fireTimer, stepTimer;
let overBtnHover = false;
const PLAY_AGAIN_BTN = { x: W / 2 - 100, y: H / 2 + 70, w: 200, h: 54 };

function startWave() {
  invaders = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) invaders.push({ r, c, alive: true });
  }
  swarm = { x: 80, y: START_Y + Math.min(wave - 1, 4) * 12, dir: 1, frame: 0 };
  playerBullet = null;
  invaderBullets = [];
  bunkers = makeBunkers();
  fireTimer = 1;
  stepTimer = 0;
}

function newGame() {
  overBtnHover = false;
  canvas.style.cursor = 'default';
  lives = 3;
  score = 0;
  wave = 1;
  state = 'play';
  invulnerable = 0;
  ship.x = W / 2 - ship.width / 2;
  startWave();
}

function invaderRect(inv) {
  const img = rowFrames[inv.r][0];
  return {
    x: swarm.x + inv.c * CELL_W + (CELL_W - img.width) / 2,
    y: swarm.y + inv.r * CELL_H,
    w: img.width,
    h: img.height
  };
}

function makeBunkers() {
  const list = [];
  const bw = BUNKER_COLS * BUNKER_CELL;
  for (let i = 0; i < BUNKER_COUNT; i++) {
    const centre = (W / BUNKER_COUNT) * (i + 0.5);
    list.push({
      x: Math.round(centre - bw / 2),
      y: BUNKER_Y,
      cells: BUNKER_SHAPE.map(row => Array.from(row, ch => ch === 'X'))
    });
  }
  return list;
}

// Test a bullet against the bunkers. On contact, remove a small ragged area
// around the first cell the bullet touches and return true.
// movingDown is true for invader bullets, false for player bullets.
function hitBunkers(bullet, movingDown) {
  for (const bk of bunkers) {
    const box = { x: bk.x, y: bk.y, w: BUNKER_COLS * BUNKER_CELL, h: BUNKER_ROWS * BUNKER_CELL };
    if (!overlap(bullet, box)) continue;
    const clampC = v => Math.max(0, Math.min(BUNKER_COLS - 1, v));
    const clampR = v => Math.max(0, Math.min(BUNKER_ROWS - 1, v));
    const cx0 = clampC(Math.floor((bullet.x - bk.x) / BUNKER_CELL));
    const cx1 = clampC(Math.floor((bullet.x + bullet.w - 0.01 - bk.x) / BUNKER_CELL));
    const cy0 = clampR(Math.floor((bullet.y - bk.y) / BUNKER_CELL));
    const cy1 = clampR(Math.floor((bullet.y + bullet.h - 0.01 - bk.y) / BUNKER_CELL));
    // Scan from the bullet's leading edge so the first cell it meets is the impact.
    for (let n = 0; n <= cy1 - cy0; n++) {
      const cy = movingDown ? cy1 - n : cy0 + n;
      for (let cx = cx0; cx <= cx1; cx++) {
        if (!bk.cells[cy][cx]) continue;
        for (let dy = -3; dy <= 3; dy++) {
          for (let dx = -3; dx <= 3; dx++) {
            const x = cx + dx, y = cy + dy;
            if (x < 0 || x >= BUNKER_COLS || y < 0 || y >= BUNKER_ROWS) continue;
            if (dx * dx + dy * dy + Math.random() * 3 <= 7) bk.cells[y][x] = false;
          }
        }
        return true;
      }
    }
  }
  return false;
}

// Hitboxes are 80% of the sprite size, centred on the sprite.
const HITBOX_SCALE = 0.8;
function hitbox(r) {
  const w = r.w * HITBOX_SCALE, h = r.h * HITBOX_SCALE;
  return { x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w, h };
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Audio (Web Audio API, synthesised, no files) ----------
let audioCtx = null;

// Browsers block audio until a user gesture, so create/resume on key press.
function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(type, f0, f1, dur, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function noiseBurst(dur, vol, fStart, fEnd) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(fStart, t);
  filter.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
}

const sfx = {
  shoot()        { tone('square', 900, 200, 0.12, 0.08); },
  invaderShoot() { tone('sawtooth', 300, 120, 0.15, 0.05); },
  explosion()    { noiseBurst(0.3, 0.3, 3000, 100); },
  gameOver() {
    noiseBurst(0.6, 0.3, 2000, 60);
    [440, 370, 311, 262].forEach((f, i) => tone('triangle', f, f * 0.9, 0.35, 0.2, 0.15 + i * 0.3));
  }
};

// ---------- Input ----------
window.addEventListener('keydown', (e) => {
  unlockAudio();
  if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
  if (e.key === 'Enter' && (state === 'over' || state === 'menu')) newGame();
  if ((e.key === 'p' || e.key === 'P') && !e.repeat) {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ') keys.fire = false;
});
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inBtn(pt) {
  const b = PLAY_AGAIN_BTN;
  return pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h;
}
canvas.addEventListener('mousemove', (e) => {
  overBtnHover = state === 'over' && inBtn(canvasPoint(e));
  canvas.style.cursor = overBtnHover ? 'pointer' : 'default';
});
canvas.addEventListener('mouseleave', () => { overBtnHover = false; canvas.style.cursor = 'default'; });
canvas.addEventListener('click', (e) => {
  unlockAudio();
  if (state === 'over' && inBtn(canvasPoint(e))) newGame();
});
window.addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; });

// ---------- Update ----------
function aliveInvaders() { return invaders.filter(i => i.alive); }

function stepSwarm() {
  const alive = aliveInvaders();
  let minX = Infinity, maxX = -Infinity;
  for (const inv of alive) {
    const r = invaderRect(inv);
    minX = Math.min(minX, r.x);
    maxX = Math.max(maxX, r.x + r.w);
  }
  const nextMin = minX + STEP_X * swarm.dir;
  const nextMax = maxX + STEP_X * swarm.dir;
  if (nextMin < EDGE_MARGIN || nextMax > W - EDGE_MARGIN) {
    swarm.y += DROP_Y;
    swarm.dir *= -1;
  } else {
    swarm.x += STEP_X * swarm.dir;
  }
  swarm.frame ^= 1;
}

function invaderFire() {
  if (invaderBullets.length >= 3) return;
  // Only the lowest invader in each column can shoot.
  const shooters = {};
  for (const inv of aliveInvaders()) {
    if (!shooters[inv.c] || inv.r > shooters[inv.c].r) shooters[inv.c] = inv;
  }
  const list = Object.values(shooters);
  if (!list.length) return;
  const s = list[Math.floor(Math.random() * list.length)];
  const r = invaderRect(s);
  invaderBullets.push({ x: r.x + r.w / 2 - 1.5, y: r.y + r.h, w: 3, h: 12 });
  sfx.invaderShoot();
}

function loseLife() {
  lives--;
  invaderBullets = [];
  if (lives <= 0) {
    state = 'over';
    sfx.gameOver();
  } else {
    sfx.explosion();
    invulnerable = 1.5;
    ship.x = W / 2 - ship.width / 2;
  }
}

function update(dt) {
  if (state !== 'play') return;

  // Player movement
  if (keys.left) ship.x -= ship.speed * dt;
  if (keys.right) ship.x += ship.speed * dt;
  ship.x = Math.max(0, Math.min(W - ship.width, ship.x));
  if (invulnerable > 0) invulnerable -= dt;

  // Player fire: one bullet on screen at a time
  if (keys.fire && !playerBullet) {
    playerBullet = { x: ship.x + ship.width / 2 - 1.5, y: ship.y - 12, w: 3, h: 12 };
    sfx.shoot();
  }
  if (playerBullet) {
    playerBullet.y -= 500 * dt;
    if (playerBullet.y + playerBullet.h < 0) playerBullet = null;
  }

  // Swarm march: speeds up as invaders die
  const alive = aliveInvaders();
  const total = ROWS * COLS;
  // 500 ms per step with a full formation, shrinking in proportion as invaders die.
  const interval = Math.max(0.05, STEP_INTERVAL * (alive.length / total) - (wave - 1) * 0.03);
  stepTimer += dt;
  if (stepTimer >= interval) {
    stepTimer = 0;
    stepSwarm();
  }

  // Invader fire
  fireTimer -= dt;
  if (fireTimer <= 0) {
    invaderFire();
    fireTimer = 0.5 + Math.random() * 0.9;
  }
  for (const b of invaderBullets) b.y += 220 * dt;
  invaderBullets = invaderBullets.filter(b => b.y < GROUND_Y);

  // Bullets damage bunkers
  if (playerBullet && hitBunkers(playerBullet, false)) playerBullet = null;
  invaderBullets = invaderBullets.filter(b => !hitBunkers(b, true));

  // Player bullet vs invaders (one hit kills)
  if (playerBullet) {
    for (const inv of alive) {
      if (overlap(playerBullet, hitbox(invaderRect(inv)))) {
        inv.alive = false;
        score += ROW_TYPES[inv.r].points;
        sfx.explosion();
        playerBullet = null;
        break;
      }
    }
  }

  // Invader bullets vs player
  const shipRect = hitbox({ x: ship.x, y: ship.y, w: ship.width, h: ship.height });
  if (invulnerable <= 0) {
    for (const b of invaderBullets) {
      if (overlap(b, shipRect)) { loseLife(); break; }
    }
  }

  // Invaders reaching the player's row end the game
  for (const inv of aliveInvaders()) {
    const r = invaderRect(inv);
    if (r.y + r.h >= ship.y) { lives = 0; state = 'over'; sfx.gameOver(); break; }
  }

  // Wave cleared
  if (state === 'play' && aliveInvaders().length === 0) {
    wave++;
    startWave();
  }
}

// ---------- Draw ----------
function drawText(text, x, y, align, size, color) {
  ctx.fillStyle = color || '#fff';
  ctx.font = (size || 18) + 'px "Courier New", monospace';
  ctx.textAlign = align || 'left';
  ctx.fillText(text, x, y);
}

function drawMenu() {
  drawText('SPACE INVADERS', W / 2, 150, 'center', 56, '#5dff4d');

  // Score table
  const table = [[0, '= 30 POINTS'], [1, '= 20 POINTS'], [3, '= 10 POINTS']];
  table.forEach(([row, label], i) => {
    const img = rowFrames[row][0];
    const y = 230 + i * 45;
    ctx.drawImage(img, W / 2 - 100 + (36 - img.width) / 2, y);
    drawText(label, W / 2 - 40, y + 20, 'left', 20);
  });

  drawText('Left / Right  Move', W / 2, 410, 'center', 18, '#aaa');
  drawText('Space  Fire', W / 2, 438, 'center', 18, '#aaa');
  drawText('P  Pause', W / 2, 466, 'center', 18, '#aaa');

  // Blinking prompt
  if (Math.floor(performance.now() / 500) % 2 === 0) {
    drawText('Press Enter to start', W / 2, 540, 'center', 24, '#ffd200');
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (state === 'menu') { drawMenu(); return; }

  // Invaders
  for (const inv of invaders) {
    if (!inv.alive) continue;
    const r = invaderRect(inv);
    ctx.drawImage(rowFrames[inv.r][swarm.frame], Math.round(r.x), Math.round(r.y));
  }

  // Bunkers
  ctx.fillStyle = BUNKER_COLOR;
  for (const bk of bunkers) {
    for (let y = 0; y < BUNKER_ROWS; y++) {
      for (let x = 0; x < BUNKER_COLS; x++) {
        if (bk.cells[y][x]) ctx.fillRect(bk.x + x * BUNKER_CELL, bk.y + y * BUNKER_CELL, BUNKER_CELL, BUNKER_CELL);
      }
    }
  }

  // Player (blinks while invulnerable)
  if (state === 'play' && (invulnerable <= 0 || Math.floor(invulnerable * 10) % 2 === 0)) {
    ctx.drawImage(cannonImg, Math.round(ship.x), ship.y);
  }

  // Bullets
  if (playerBullet) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(playerBullet.x, playerBullet.y, playerBullet.w, playerBullet.h);
  }
  ctx.fillStyle = '#ffd200';
  for (const b of invaderBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

  // HUD: score top-left, ground line under the cannon, lives bottom-left
  drawPixelText('SCORE ' + String(score).padStart(5, '0'), 12, 12, 3, '#fff');
  ctx.fillStyle = CANNON_COLOR;
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  drawPixelText(String(Math.max(0, lives)), 12, GROUND_Y + 10, 2, '#fff');
  for (let i = 0; i < lives; i++) ctx.drawImage(cannonIcon, 36 + i * 34, GROUND_Y + 8);

  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, H / 2 - 10, 'center', 48, '#00e5ff');
    drawText('Press P to resume', W / 2, H / 2 + 30, 'center', 20);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, W, H);
    drawText('GAME OVER', W / 2, H / 2 - 40, 'center', 64, '#ff3b3b');
    drawText('FINAL SCORE ' + String(score).padStart(5, '0'), W / 2, H / 2 + 20, 'center', 26, '#fff');

    const b = PLAY_AGAIN_BTN;
    ctx.fillStyle = overBtnHover ? '#5dff4d' : '#1f7a17';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.lineWidth = overBtnHover ? 4 : 2;
    ctx.strokeStyle = overBtnHover ? '#fff' : '#5dff4d';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    drawText('PLAY AGAIN', b.x + b.w / 2, b.y + b.h / 2 + 8, 'center', 24, overBtnHover ? '#000' : '#fff');
    drawText('or press Enter', W / 2, b.y + b.h + 30, 'center', 16, '#aaa');
  }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

newGame();
state = 'menu';
requestAnimationFrame(loop);
</script>
